version: '3.9'

services:
  postgres:
    image: postgres:17.6-alpine
    container_name: postgresql
    restart: unless-stopped
    hostname: "postgresql"
    networks:
      - postgres-network
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: cmlkaG9nYW50ZW5n
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - /postgres/data:/var/lib/postgresql/data/pgdata
      - /postgres/scripts:/scripts
    logging:
      driver: "json-file"
      options:
        max-size: "1g"
        max-file: "10"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5    

networks:
  postgres-network:
    external: true
