services:
  redis:
    image: redis:7-alpine
    container_name: hermina-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    # image: lets the deploy server do `docker compose pull` against the
    # image CI built and pushed, without needing the Dockerfile/build
    # context locally. `build:` stays so local dev can still
    # `docker compose build api` from source when iterating.
    image: ghcr.io/sayyidtrq/herminacrawler:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hermina-review-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./exports:/app/exports
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      redis:
        condition: service_healthy


  crawl-worker:
    image: ghcr.io/sayyidtrq/herminacrawler:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hermina-crawl-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SKIP_MIGRATIONS: "true"
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["/app/scripts/run_crawl_worker.sh"]
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

volumes:
  redis-data:
