services:
  api:
    # image: lets the deploy server do `docker compose pull` against the
    # image CI built and pushed, without needing the Dockerfile/build
    # context locally. `build:` stays so local dev can still
    # `docker compose build api` from source when iterating.
    image: ghcr.io/sayyidtrq/herminacrawler:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hermina-review-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./exports:/app/exports
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s


  crawl-worker:
    image: ghcr.io/sayyidtrq/herminacrawler:latest
    container_name: hermina-crawl-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SKIP_MIGRATIONS: "true"
      SELENIUM_HEADLESS: "${SELENIUM_HEADLESS:-true}"
      SELENIUM_USER_DATA_DIR: /app/.selenium-profile
    command: ["/app/scripts/run_crawl_worker.sh"]
    volumes:
      - selenium-profile:/app/.selenium-profile
    depends_on:
      api:
        condition: service_healthy

volumes:
  selenium-profile:
